[package]
name = "ai-analyzer"
version = "0.3.0"
description = "Cost and pricing analyzer for SaaS systems"
authors = ["juando"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pricing-engine = { path = "../crates/pricing-engine" }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json"] }
# The Anthropic API key lives in the macOS Keychain, never in the database.
# The default "v1" feature already wires up the Apple keychain store.
keyring = "4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-process = "2.3.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.11.0"
