# Builds the desktop app for macOS and Windows and publishes the installers as a
# GitHub release. Tag a version (git tag v0.1.0 && git push --tags) or run it by
# hand from the Actions tab. The release goes out published, not as a draft.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS build that runs on both Apple Silicon and Intel.
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - platform: windows-latest
            rust-targets: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without these the bundles carry no signature and the in-app updater
          # refuses them. Both are repository secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-{1}', github.run_number, github.sha) }}
          releaseName: Finanz analyzer ${{ github.ref_type == 'tag' && github.ref_name || github.run_number }}
          releaseBody: "Unsigned builds. macOS: right-click the app and choose Open the first time. Windows: SmartScreen asks for More info → Run anyway."
          releaseDraft: false
          # Publishes latest.json, which is what Settings → Updates reads.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
